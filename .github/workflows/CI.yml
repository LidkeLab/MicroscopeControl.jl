name: CI
# Actions minutes are a shared, finite resource, so this workflow is
# deliberately thin. The real gate is the LOCAL suite, run before pushing
# (see CLAUDE.md "Testing policy"); CI is confirmation, not the first
# signal. Concretely: a pull request runs ONE Julia version, no docs build,
# and nothing at all for a prose-only change; the full matrix and the docs
# build run once on `main` and on tags, where the tag is actually cut.
# To get full signal on a branch without opening a pull request:
#   gh workflow run CI.yml --ref <branch>
on:
  push:
    branches:
      - main
      # Release-candidate branches accumulate fixes between releases (see
      # CLAUDE.md "Versioning"). A merge into one is an integration point, so
      # it earns the full matrix once — pull requests INTO it still run the
      # reduced set, like any other pull request.
      - '[0-9]+.[0-9]+rc[0-9]+'
    tags: ['*']
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'dev/**'
      - '.claude/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CLAUDE.md'
      - 'LICENSE'
      # NOT a blanket '**.md': test/skills.jl reads each shipped SKILL.md and
      # asserts on its frontmatter and version stamp, so a skills/*.md edit
      # really can break the suite and must still be tested.
  workflow_dispatch:
concurrency:
  # Cancel superseded runs on EVERY ref, not just pull requests: when a branch
  # gets several pushes in a row only the last one is worth building, and the
  # earlier runs are pure waste. Tags are unaffected in practice because each
  # tag is its own ref and so its own group.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # A pull request runs current Julia only. The oldest supported
        # version is exercised locally before pushing and again here on
        # `main`/tags, which is where a version actually ships. Halving the
        # matrix on the branch that gets pushed most is most of the saving.
        version: ${{ github.event_name == 'pull_request' && fromJSON('["1"]') || fromJSON('["1.11", "1"]') }}
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      # GLMakie (a hard dependency) needs an X display even to precompile,
      # so run a virtual framebuffer for the whole job.
      - name: Start virtual X display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1280x1024x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          prefix: xvfb-run -a
      # Coverage is computed and uploaded once, from the `main`/tag run, not
      # from every push to every branch.
      - uses: julia-actions/julia-processcoverage@v1
        if: github.event_name != 'pull_request'
      - uses: codecov/codecov-action@v6
        if: github.event_name != 'pull_request'
        with:
          files: lcov.info
  version-bumped:
    name: Version bumped
    runs-on: ubuntu-latest
    # Only for pull requests into `main`, where a merge is tagged. Work
    # accumulating on a release-candidate branch deliberately does not bump
    # per merge — the version moves once, when the release is cut — and this
    # check would otherwise reject every pull request into that branch, since
    # it demands a plain X.Y.Z strictly greater than the base.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Fetch base branch
        # Explicit refspec: actions/checkout's fetch config isn't guaranteed
        # to update refs/remotes/origin/<branch> for a plain `git fetch
        # origin <branch>`, and `git show origin/<base>:...` below needs it.
        run: git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --depth=1
      - name: Check Project.toml version is a real, untagged bump
        run: |
          # ubuntu-latest ships Python >=3.11, so tomllib is stdlib. Each
          # snippet below is kept on one physical line on purpose: a `run: |`
          # block scalar requires every line to carry the step's own
          # indentation, and Python does not tolerate an indented first line.
          read_version() {
            python3 -c 'import re, sys, tomllib; v = tomllib.load(sys.stdin.buffer)["version"]; print(v) if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", v) else sys.exit(f"invalid version for tagging: {v}")'
          }
          pr_version=$(read_version < Project.toml)
          # The base may still carry a prerelease version (e.g. 1.0.0-DEV before
          # the 0.x reset); parse it leniently and only compare against a plain X.Y.Z.
          base_version=$(git show "origin/${{ github.base_ref }}:Project.toml" | python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["version"])')

          tag="v${pr_version}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "bump Project.toml version; $tag is already tagged"
            exit 1
          fi

          if [[ "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            python3 -c 'import sys; parse = lambda v: tuple(int(x) for x in v.split(".")); pr, base = sys.argv[1], sys.argv[2]; sys.exit(f"Project.toml version {pr} must be greater than base branch version {base}") if not (parse(pr) > parse(base)) else None' "$pr_version" "$base_version"
          else
            echo "base branch version $base_version is a prerelease; skipping ordering check (version reset)"
          fi
  docs:
    name: Documentation
    # The longest job in this workflow by a wide margin, and it deploys
    # nothing from a pull request anyway. It runs on `main`, on tags, and on
    # demand. A docs change is checked locally with
    # `julia --project=docs docs/make.jl`.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Start virtual X display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1280x1024x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Configure doc environment
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      - uses: julia-actions/julia-buildpkg@v1
      # No xvfb-run prefix here: julia-docdeploy@v1 passes a multi-word prefix
      # as a single command name (exit 127). DISPLAY from the Xvfb step above
      # is enough for GLMakie.
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run doctests
        shell: julia --project=docs --color=yes {0}
        run: |
          using Documenter: DocMeta, doctest
          using MicroscopeControl
          DocMeta.setdocmeta!(MicroscopeControl, :DocTestSetup, :(using MicroscopeControl); recursive=true)
          doctest(MicroscopeControl)
