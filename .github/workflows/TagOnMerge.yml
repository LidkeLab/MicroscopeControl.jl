name: TagOnMerge

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag the merged version if it doesn't exist yet
        run: |
          version=$(grep -m1 '^version' Project.toml | sed -E 's/version *= *"(.*)"/\1/')
          tag="v${version}"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            if [ "$(git rev-parse "refs/tags/$tag^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "main has moved past $tag without a version bump; bump Project.toml"
              exit 1
            fi
            echo "Tag $tag already exists at HEAD, nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
