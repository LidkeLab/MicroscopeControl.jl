name: CompatHelper
on:
  schedule:
    # Weekly, not daily: this package is unregistered and its consumers pin
    # exact tags, so a one-day-old compat bound is worth nothing and a run a
    # day is six wasted runs a week.
    - cron: 0 0 * * 1
  workflow_dispatch:
jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      - name: Pkg.add("CompatHelper")
        run: julia -e 'using Pkg; Pkg.add("CompatHelper")'
      - name: CompatHelper.main()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPATHELPER_PRIV: ${{ secrets.DOCUMENTER_KEY }}
        run: julia -e 'using CompatHelper; CompatHelper.main()'
